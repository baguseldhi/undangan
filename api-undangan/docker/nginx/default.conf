server {
    listen 80;
    server_name weddingnadiabagus.my.id www.weddingnadiabagus.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name weddingnadiabagus.my.id www.weddingnadiabagus.my.id;

    ssl_certificate /etc/letsencrypt/live/weddingnadiabagus.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weddingnadiabagus.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/public;
    index index.html index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|webp|mp3|mp4|webm|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 30d;
    }

    location ^~ /api/ {
        rewrite ^/api(/.*)$ $1 break;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}