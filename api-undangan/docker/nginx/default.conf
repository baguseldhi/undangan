server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.html index.php;   # ← index.html didahulukan

    location / {
        try_files $uri $uri/ /index.html;   # ← arahkan ke index.html dulu
    }

    # Khusus request API ke PHP
    location ~ ^/(session|comment|stats|download|user|key|v2) {
        try_files $uri $uri/ /index.php?$query_string;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}