services:
    app:
        build:
            context: ./api-undangan
            dockerfile: docker/php/Dockerfile
        container_name: undangan-app
        depends_on:
            - db
        networks:
            - undangan
        restart: always

    db:
        image: postgres:16
        container_name: undangan-db
        environment:
            POSTGRES_DB: undangan
            POSTGRES_USER: undangan_user
            POSTGRES_PASSWORD: Password123Aman!
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - undangan
        restart: always

    frontend:
        image: node:20-alpine
        container_name: undangan-frontend
        working_dir: /app
        user: root
        environment:
            - APP_URL=https://weddingnadiabagus.my.id
            - DEST_DIR=/app/api-undangan/public
        volumes:
            - .:/app
            - ./api-undangan:/app/api-undangan
        command: sh -c "chmod -R 777 /app/api-undangan/public 2>/dev/null || true; npm install && npm run build:public"
        networks:
            - undangan

    nginx:
        image: nginx:alpine
        container_name: undangan-nginx
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - app
            - frontend
        networks:
            - undangan
        volumes:
            - ./api-undangan/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./api-undangan:/var/www
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        restart: always

    certbot:
        image: certbot/certbot
        container_name: undangan-certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
    postgres_data:

networks:
    undangan:
        driver: bridge